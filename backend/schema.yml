          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TodoItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TodoItem'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoItem'
          description: ''
    patch:
      operationId: todoItems_partial_update
